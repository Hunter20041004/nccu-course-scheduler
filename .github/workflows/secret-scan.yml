name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed commits with redacted output
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Download pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "${scanner_dir}"
          curl --fail --silent --show-error --location \
            --output "${scanner_dir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}"
          curl --fail --silent --show-error --location \
            --output "${scanner_dir}/gitleaks_8.30.1_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print }' \
            "${scanner_dir}/gitleaks_8.30.1_checksums.txt" \
            | (cd "${scanner_dir}" && sha256sum --check -)
          tar --extract --gzip --file "${scanner_dir}/${archive}" --directory "${scanner_dir}" gitleaks
          echo "${scanner_dir}" >> "${GITHUB_PATH}"

      - name: Rescan every commit with fully redacted output
        shell: bash
        run: >-
          gitleaks git --log-opts="--all" --gitleaks-ignore-path=.gitleaksignore
          --redact=100 --no-banner
